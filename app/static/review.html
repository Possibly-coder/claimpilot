<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ClaimPilot · Review queue</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#f8fafc; --card:#fff; --line:#e2e8f0; --ink:#0f172a; --muted:#64748b; --blue:#2563eb; --amber:#b45309; --green:#15803d; --red:#b91c1c; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.5 -apple-system, Helvetica, Arial, sans-serif; background:var(--bg); color:var(--ink); }
  header { padding:14px 24px; background:var(--ink); color:#fff; display:flex; align-items:center; gap:16px; }
  header h1 { font-size:18px; margin:0; }
  header span { color:#94a3b8; }
  main { display:grid; grid-template-columns:320px 1fr; gap:16px; padding:16px 24px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .tabs button { border:1px solid var(--line); background:#fff; padding:4px 10px; border-radius:6px; cursor:pointer; margin:0 4px 8px 0; }
  .tabs button.active { background:var(--blue); color:#fff; border-color:var(--blue); }
  .item { padding:10px; border-bottom:1px solid var(--line); cursor:pointer; }
  .item:hover, .item.sel { background:#eff6ff; }
  .pill { display:inline-block; padding:1px 8px; border-radius:999px; font-size:12px; background:#f1f5f9; }
  .pill.needs_review { background:#fef3c7; color:var(--amber); }
  .pill.auto_submitted, .pill.approved { background:#dcfce7; color:var(--green); }
  .pill.rejected, .pill.writeback_failed { background:#fee2e2; color:var(--red); }
  .detail { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  pre { white-space:pre-wrap; background:#f8fafc; border:1px solid var(--line); border-radius:8px; padding:10px; max-height:520px; overflow:auto; }
  label { display:block; font-size:12px; color:var(--muted); margin-top:8px; }
  input, select, textarea { width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:6px; font:inherit; }
  .reasons li { color:var(--amber); }
  .actions { margin-top:12px; display:flex; gap:8px; }
  .actions button { padding:8px 14px; border:0; border-radius:6px; cursor:pointer; color:#fff; }
  .approve { background:var(--green); } .reject { background:var(--red); }
  .meta { color:var(--muted); font-size:12px; }
  details { margin-top:12px; }
</style>
</head>
<body>
<header><h1>ClaimPilot</h1><span id="health">loading…</span></header>
<main>
  <section class="card">
    <div class="tabs" id="tabs"></div>
    <div id="list"></div>
    <details>
      <summary>Submit a test email</summary>
      <label>Sender</label><input id="t-sender" value="carlos.khan@example.com">
      <label>Subject</label><input id="t-subject" value="Claim - rear-ended">
      <label>Body</label><textarea id="t-body" rows="7">My name is Carlos Khan, policy POL-770487.
On 2025-06-23, I was rear-ended at a light.
The repair estimate is $1,200.
Regards,
Carlos Khan</textarea>
      <div class="actions"><button class="approve" onclick="submitTest()">Send</button></div>
    </details>
  </section>
  <section class="card" id="detail"><p class="meta">Select a claim.</p></section>
</main>
<script>
const STATUSES = ["needs_review", "writeback_failed", "auto_submitted", "approved", "rejected"];
const LOSS = ["auto_collision", "auto_theft", "property_water", "property_fire", "other"];
let status = "needs_review", selected = null;
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function api(path, opts) {
  const r = await fetch(path, opts);
  if (!r.ok) { alert(`${r.status}: ${await r.text()}`); throw new Error(r.status); }
  return r.json();
}
function renderTabs() {
  document.getElementById("tabs").innerHTML = STATUSES.map(s =>
    `<button class="${s === status ? "active" : ""}" onclick="status='${s}';load()">${s.replace("_", " ")}</button>`).join("");
}
async function load() {
  renderTabs();
  const claims = await api(`/claims?status=${status}`);
  document.getElementById("list").innerHTML = claims.length ? claims.map(c => `
    <div class="item ${selected === c.id ? "sel" : ""}" onclick="show(${c.id})">
      <b>#${c.id}</b> ${esc(c.extracted.claimant_name || c.sender)}
      <div class="meta">${esc(c.subject)} · conf ${c.confidence.toFixed(2)}</div>
    </div>`).join("") : `<p class="meta">Nothing here.</p>`;
}
async function show(id) {
  selected = id;
  const c = await api(`/claims/${id}`);
  const e = c.extracted;
  const editable = c.status === "needs_review" || c.status === "writeback_failed";
  document.getElementById("detail").innerHTML = `
    <h2 style="margin-top:0">Claim #${c.id} <span class="pill ${c.status}">${c.status}</span></h2>
    <p class="meta">${esc(c.sender)} · ${esc(c.extractor)} · ${c.latency_ms.toFixed(0)} ms · $${c.cost_usd.toFixed(5)}${c.legacy_ref ? " · legacy ref " + esc(c.legacy_ref) : ""}</p>
    ${c.reasons.length ? `<ul class="reasons">${c.reasons.map(r => `<li>${esc(r)}</li>`).join("")}</ul>` : ""}
    <div class="detail">
      <div><label>Original email + attachments</label><pre>${esc(c.raw_text)}</pre></div>
      <div>
        <label>Policy number</label><input id="f-policy_number" value="${esc(e.policy_number)}" ${editable ? "" : "disabled"}>
        <label>Claimant name</label><input id="f-claimant_name" value="${esc(e.claimant_name)}" ${editable ? "" : "disabled"}>
        <label>Incident date</label><input id="f-incident_date" type="date" value="${esc(e.incident_date)}" ${editable ? "" : "disabled"}>
        <label>Loss type</label><select id="f-loss_type" ${editable ? "" : "disabled"}>
          <option value=""></option>${LOSS.map(l => `<option ${l === e.loss_type ? "selected" : ""}>${l}</option>`).join("")}</select>
        <label>Estimated amount (USD)</label><input id="f-estimated_amount" type="number" step="0.01" value="${e.estimated_amount ?? ""}" ${editable ? "" : "disabled"}>
        <label>Description</label><textarea id="f-description" rows="3" ${editable ? "" : "disabled"}>${esc(e.description)}</textarea>
        ${editable ? `<div class="actions">
          <button class="approve" onclick="approve(${c.id})">Approve & submit</button>
          ${c.status === "needs_review" ? `<button class="reject" onclick="reject(${c.id})">Reject</button>` : ""}
        </div>` : ""}
      </div>
    </div>`;
  load();
}
async function approve(id) {
  const v = k => document.getElementById("f-" + k).value || null;
  const corrections = {
    policy_number: v("policy_number"), claimant_name: v("claimant_name"), incident_date: v("incident_date"),
    loss_type: v("loss_type"), estimated_amount: v("estimated_amount") ? Number(v("estimated_amount")) : null,
    description: v("description"),
  };
  await api(`/claims/${id}/approve`, {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({corrections})});
  show(id);
}
async function reject(id) { await api(`/claims/${id}/reject`, {method: "POST"}); show(id); }
async function submitTest() {
  const c = await api("/claims/intake", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({
    sender: document.getElementById("t-sender").value, subject: document.getElementById("t-subject").value,
    body: document.getElementById("t-body").value})});
  status = c.status; show(c.id);
}
api("/health").then(h => document.getElementById("health").textContent =
  `extractor: ${h.extractor} · legacy write-back: ${h.legacy_writeback ? "on" : "off"}`);
load();
</script>
</body>
</html>
