services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: claimpilot
      POSTGRES_PASSWORD: claimpilot
      POSTGRES_DB: claimpilot
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimpilot"]
      interval: 3s
      retries: 10

  legacy:
    build: .
    command: uvicorn legacy_api.main:app --host 0.0.0.0 --port 9000
    environment:
      LEGACY_FAILURE_RATE: "0.2"
      LEGACY_RATE_LIMIT_PER_SEC: "5"

  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://claimpilot:claimpilot@db:5432/claimpilot
      LEGACY_API_URL: http://legacy:9000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAIMPILOT_MODEL: ${CLAIMPILOT_MODEL:-claude-haiku-5-5}
    depends_on:
      db:
        condition: service_healthy
      legacy:
        condition: service_started
